name: docflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docflow
      MINIO_ROOT_PASSWORD: docflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
    environment:
      DOCFLOW_DATABASE_URL: postgresql+asyncpg://docflow:docflow@postgres:5432/docflow
      DOCFLOW_AUTO_CREATE_SCHEMA: "true"
      DOCFLOW_STORAGE_ROOT: /data/storage
      DOCFLOW_REDIS_URL: redis://redis:6379/0
      DOCFLOW_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - api_storage:/data/storage

  worker:
    build:
      context: ./apps/api
    command: celery -A docflow.infrastructure.queue.celery_app:celery_app worker --loglevel=INFO
    environment:
      DOCFLOW_DATABASE_URL: postgresql+asyncpg://docflow:docflow@postgres:5432/docflow
      DOCFLOW_STORAGE_ROOT: /data/storage
      DOCFLOW_REDIS_URL: redis://redis:6379/0
      DOCFLOW_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  minio_data:
  api_storage:
