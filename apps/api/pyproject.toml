[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "docflow-api"
version = "0.1.0"
description = "Document extraction and review workflow API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiosqlite>=0.21",
  "alembic>=1.14",
  "anthropic>=0.49",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "boto3>=1.35",
  "celery[redis]>=5.4",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jinja2>=3.1",
  "opencv-python-headless>=4.10",
  "orjson>=3.10",
  "pillow>=11.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyjwt[crypto]>=2.10",
  "pymupdf>=1.25",
  "python-multipart>=0.0.20",
  "pytesseract>=0.3.13",
  "pyyaml>=6.0",
  "rapidfuzz>=3.11",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "structlog>=24.4",
  "tenacity>=9.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "testcontainers[postgres]>=4.9",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
